; extensions.conf — dialplan
;
; Минимальный набор контекстов:
;   from-operators — то, что приходит от браузерного клиента (внутренние номера и тестовый звонок)
;   from-trunk     — входящие из внешнего SIP-trunk (в проде — провайдер; для демо — эхо-эндпоинт)
;   stasis-route   — общий маршрут в Stasis-приложение poc-stasis (его слушает Node.js)
;
; ВАЖНО: очередей и переводов между операторами в dialplan НЕТ — это в требованиях.
; Маршрутизация ВСЕХ входящих с trunk идёт через Stasis → решение принимает crm-backend.

[globals]
STASIS_APP = poc-stasis

[from-operators]
; Прямой набор внутреннего экстеншена 100X — для теста между двумя браузерами
exten => _100X,1,NoOp(Internal call from ${CALLERID(num)} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Имитация исходящего: всё что не 100X — кидаем в Stasis (можно использовать как тестовый канал)
exten => _X.,1,NoOp(Outbound from ${CALLERID(num)} to ${EXTEN})
 same => n,Stasis(${STASIS_APP},outbound,${EXTEN})
 same => n,Hangup()

[from-trunk]
; Все входящие с провайдера → Stasis. Решение о маршрутизации (account-isolation)
; принимает Node.js backend, не Asterisk.
exten => _X.,1,NoOp(Inbound from ${CALLERID(num)} to DID ${EXTEN})
 same => n,Answer()
 same => n,Stasis(${STASIS_APP},inbound,${EXTEN},${CALLERID(num)})
 same => n,Hangup()

[stasis-route]
exten => s,1,Stasis(${STASIS_APP})
 same => n,Hangup()
