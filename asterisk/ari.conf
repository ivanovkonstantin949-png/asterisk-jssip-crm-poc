; ari.conf — Asterisk REST Interface
;
; Логин/пароль ARI должны совпадать с переменными ARI_USER/ARI_PASS в .env crm-backend.
; Значения ниже — DEMO CREDENTIALS, не для прода. В проде рендерить из шаблона
; через Ansible Vault / sops / 1Password CLI.

[general]
enabled = yes
pretty = yes
allowed_origins = http://localhost:8080,http://127.0.0.1:8080

[poc-app]
type = user
read_only = no
password = demo-ari-pass-2026
password_format = plain
