; ari.conf — Asterisk REST Interface
;
; Логин/пароль ARI должны совпадать с переменными ARI_USER/ARI_PASS в .env crm-backend.
; Здесь стоят placeholder'ы, реальные значения подставляются при деплое:
;   envsubst < ari.conf.template > ari.conf
; либо через Ansible/sops.

[general]
enabled = yes
pretty = yes
allowed_origins = http://localhost:8080,http://127.0.0.1:8080

[poc-app]
type = user
read_only = no
password = CHANGE_ME_ARI_USER_PASSWORD
password_format = plain
