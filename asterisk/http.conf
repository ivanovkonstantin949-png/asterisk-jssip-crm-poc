; http.conf — HTTP-сервер Asterisk для ARI и WebSocket-транспорта jsSIP

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
; HTTPS для WSS-транспорта (продакшен)
; tlsenable = yes
; tlsbindaddr = 0.0.0.0:8089
; tlscertfile = /etc/asterisk/keys/fullchain.pem
; tlsprivatekey = /etc/asterisk/keys/privkey.pem
servername = poc-asterisk
sessionlimit = 200
session_inactivity = 30000
session_keep_alive = 15000
