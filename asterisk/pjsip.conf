; pjsip.conf — WebRTC endpoints для браузерных операторов
;
; Транспорт WSS на 8089 (TLS) и WS на 8088 (для локального теста через docker-compose).
; В проде оставить только WSS с реальным сертификатом.
;
; Пароли операторов — placeholder'ы CHANGE_ME_<id>. Перед запуском заменить через
; sed -i "s/CHANGE_ME_1001/$OP1001_PASSWORD/" pjsip.conf  (или взять из vault).
; В проде — рендер из шаблона через Ansible Vault / sops / 1Password CLI.

[transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0:8088

[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8089
; cert_file = /etc/asterisk/keys/fullchain.pem
; priv_key_file = /etc/asterisk/keys/privkey.pem

; Шаблон WebRTC-эндпоинта оператора
[webrtc-endpoint](!)
type = endpoint
context = from-operators
disallow = all
allow = opus,g722,ulaw,alaw
webrtc = yes
dtls_auto_generate_cert = yes
ice_support = yes
use_avpf = yes
media_encryption = dtls
media_use_received_transport = yes
rtcp_mux = yes
direct_media = no
force_rport = yes
rewrite_contact = yes

[webrtc-auth](!)
type = auth
auth_type = userpass

[webrtc-aor](!)
type = aor
max_contacts = 1
remove_existing = yes

; Оператор 1001
[1001](webrtc-endpoint)
auth = 1001-auth
aors = 1001

[1001-auth](webrtc-auth)
username = 1001
password = CHANGE_ME_1001

[1001](webrtc-aor)

; Оператор 1002
[1002](webrtc-endpoint)
auth = 1002-auth
aors = 1002

[1002-auth](webrtc-auth)
username = 1002
password = CHANGE_ME_1002

[1002](webrtc-aor)

; Оператор 1003 (для тестов масштабирования)
[1003](webrtc-endpoint)
auth = 1003-auth
aors = 1003

[1003-auth](webrtc-auth)
username = 1003
password = CHANGE_ME_1003

[1003](webrtc-aor)
