services:
  asterisk:
    image: andrius/asterisk:20.7-cert10_debian-trixie
    container_name: poc-asterisk
    restart: unless-stopped
    # Bridge networking с явными портами — работает и на Linux, и на macOS Docker Desktop.
    # Для прода/больших нагрузок переключить на network_mode: host (Linux only).
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8088:8088/tcp"   # HTTP (ARI + WS для jsSIP)
      - "8089:8089/tcp"   # HTTPS/WSS (TLS, опционально)
      - "10000-10010:10000-10010/udp"  # узкий RTP-диапазон под демо
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./asterisk/modules.conf:/etc/asterisk/modules.conf:ro

  crm-backend:
    build: ./crm-backend
    container_name: poc-crm-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ARI_URL=${ARI_URL:-http://asterisk:8088}
      - ARI_USER=${ARI_USER}
      - ARI_PASS=${ARI_PASS}
      - ARI_APP=${ARI_APP:-poc-stasis}
      - PORT=3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      - asterisk

  browser-client:
    image: nginx:alpine
    container_name: poc-browser-client
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./browser-client:/usr/share/nginx/html:ro
