services:
  asterisk:
    image: andrius/asterisk:20.7-cert10_debian-trixie
    container_name: poc-asterisk
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "8088:8088/tcp"
      - "8089:8089/tcp"
      - "10000-10010:10000-10010/udp"
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/ari.conf:/etc/asterisk/ari.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./asterisk/modules.conf:/etc/asterisk/modules.conf:ro

  mock-crm:
    build: ./mock-crm
    container_name: poc-mock-crm
    restart: unless-stopped
    environment:
      - PORT=4000
    ports:
      - "${MOCK_CRM_PORT:-4000}:4000"

  voice-gateway:
    build: ./voice-gateway
    container_name: poc-voice-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ARI_URL=${ARI_URL:-http://asterisk:8088}
      - ARI_USER=${ARI_USER}
      - ARI_PASS=${ARI_PASS}
      - ARI_APP=${ARI_APP:-poc-stasis}
      - PORT=3000
      - CRM_HTTP_URL=http://mock-crm:4000
      - CRM_WS_URL=ws://mock-crm:4000/ws/manager-status
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      - asterisk
      - mock-crm

  browser-client:
    image: nginx:alpine
    container_name: poc-browser-client
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./browser-client:/usr/share/nginx/html:ro
